name: Build PrivateLM Android repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply isolated repair
        shell: python
        run: |
          from pathlib import Path
          p=Path('local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/src/models/qwen35.cpp')
          s=p.read_text()
          old='int mtp_flags = !ml.load_mtp ? TENSOR_SKIP : 0;'
          assert old in s
          p.write_text(s.replace(old,'int mtp_flags = !ml.load_mtp ? (TENSOR_SKIP | TENSOR_NOT_REQUIRED) : 0;',1))
          p=Path('android/app/build.gradle.kts')
          s=p.read_text().replace('applicationId = "com.orailnoor.privatelm"','applicationId = "com.orailnoor.privatelm.repair"')
          p.write_text(s)
      - run: flutter pub get
      - run: flutter build apk --debug --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: PrivateLM-Android-repair
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
